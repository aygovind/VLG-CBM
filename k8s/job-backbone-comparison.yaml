# The LF-CBM backbone comparison, repeated under VLG-CBM. Ten runs: five CBMs and the
# five matching black-box linear probes, over bioclip / vit_in21k / dino_vitb16 /
# clip_ViT-B/16 / resnet50.
#
# The configs are generated from configs/birds525_bioclip.json and differ ONLY in
# backbone, feature_layer, use_clip_penultimate and save_dir, so accuracy differences are
# attributable to the backbone alone. Unlike LF-CBM there is no clip_name to hold fixed:
# concepts come from the Grounding DINO annotations, which are backbone-independent and
# shared by every run. That also means bioclip_birds525 and bioclip_birds525_vitb_concepts
# collapse into a single run here -- there is no concept encoder to ablate.
#
# Requires k8s/job-annotate-birds525.yaml to have finished, and timm in the env.
# Preflight checks both.
#
# Cost: measured on the completed birds525/bioclip run, a CBM run is 10min concept
# filtering + 6.2min per CBL epoch + ~109min for the final layer. At cbl_epochs 10, and
# with the concept features now GPU-resident for SAGA, expect ~1.5-2h per CBM run and
# ~30min per standard run, so roughly 8-12h for the suite.
#
# cbl_epochs is 10 because epochs are the wrong unit: birds525 is 2,381 steps/epoch
# against CUB's 169, so 10 epochs here is 23,810 steps -- 1.9x the 12,675 steps upstream
# used for CUB's 75. The first birds525 run was flat in both train and val loss from
# epoch 2 of 20.
#
# The standard runs go first: they exercise the same backbone-loading path for a fraction
# of the time, so a broken backbone surfaces within the hour instead of hours deep.
# --skip_existing makes an evicted job resume at run granularity -- which also means a
# finished run is skipped even if its config has since changed. See the note in
# run_suite.is_complete.
#
# Submit:  kubectl apply -f k8s/job-backbone-comparison.yaml
# Watch:   kubectl logs -f job/vlgcbm-backbone-comparison
apiVersion: batch/v1
kind: Job
metadata:
  name: vlgcbm-backbone-comparison
  labels:
    app: vlgcbm
    run: backbone-comparison
spec:
  backoffLimit: 4                  # evictions are likely; --skip_existing makes a retry resume
  activeDeadlineSeconds: 259200    # 72h -- the suite is ~23h, leaving room for one full retry
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: vlgcbm
        run: backbone-comparison
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: trainer
          image: gitlab-registry.nrp-nautilus.io/nrp/scientific-images/python
          env:
            - name: HF_HOME
              value: /workspace/.cache/huggingface
            - name: TORCH_HOME
              value: /workspace/.cache/torch
            - name: PIP_CACHE_DIR
              value: /workspace/.cache/pip
            - name: DATASET_FOLDER
              value: /workspace/VLG-CBM/datasets
            - name: VLGCBM_BIOCLIP_CKPT
              value: /workspace/models/bioclip/open_clip_pytorch_model.bin
            - name: SUITE
              value: backbone_comparison
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eo pipefail

              echo "===== environment ====="
              nvidia-smi
              source /opt/conda/etc/profile.d/conda.sh
              conda activate /workspace/envs/vlgcbm
              cd /workspace/VLG-CBM
              python -c "import torch; print('torch', torch.__version__, '| cuda:', torch.cuda.is_available())"

              echo "===== code version ====="
              git rev-parse HEAD
              git status --short || true

              echo "===== preflight ====="
              python -c "import timm; print('timm', timm.__version__)" \
                || { echo 'FATAL: timm not installed. Fix with:'; \
                     echo '  conda activate /workspace/envs/vlgcbm && pip install timm'; exit 1; }

              for split in train val; do
                n_img=$(find "datasets/birds525/$split" -name '*.jpg' | wc -l)
                n_ann=$(ls "annotations/birds525_$split" 2>/dev/null | wc -l)
                echo "birds525_$split: $n_img images, $n_ann annotations"
                # ConceptDataset indexes annotations by dataset position, so a missing
                # json is a hard error mid-epoch rather than a skipped sample
                test "$n_img" -eq "$n_ann" \
                  || { echo "FATAL: annotation count != image count for $split"; exit 1; }
              done

              # confirm every backbone loads and reports the dimension its config claims,
              # before committing ~23h of GPU time to them
              python - <<'PREFLIGHT'
              import json, torch
              from model.cbm import Backbone, BackboneCLIP
              for name in ("bioclip", "vit_in21k", "dino", "clip_vitb16", "rn50"):
                  cfg = json.load(open(f"configs/birds525_{name}.json"))
                  bb = (BackboneCLIP(cfg["backbone"], use_penultimate=cfg["use_clip_penultimate"], device="cuda")
                        if cfg["backbone"].startswith("clip_")
                        else Backbone(cfg["backbone"], cfg["feature_layer"], "cuda"))
                  with torch.no_grad():
                      f = bb(torch.randn(2, 3, 224, 224).cuda())
                  assert f.shape == (2, bb.output_dim), (name, f.shape, bb.output_dim)
                  print(f"  {name:12s} {cfg['backbone']:16s} -> {tuple(f.shape)}")
                  del bb
                  torch.cuda.empty_cache()
              PREFLIGHT

              echo "PVC free space:"; df -h /workspace | tail -1

              echo "===== plan ====="
              python run_suite.py --suite "$SUITE" --skip_existing --dry_run

              echo "===== suite: $SUITE ====="
              python run_suite.py --suite "$SUITE" --skip_existing
          volumeMounts:
            - name: ml-storage
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "8"
              memory: "20Gi"
              ephemeral-storage: "10Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "9"
              memory: "24Gi"
              ephemeral-storage: "12Gi"
              nvidia.com/gpu: "1"
      volumes:
        - name: ml-storage
          persistentVolumeClaim:
            claimName: ayush-workspace
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # Every backbone is frozen, so 11GB suffices. Same pool the LF-CBM
                  # backbone-comparison job used: Turing-or-newer, tensor cores present.
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-2080-Ti
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-A10
                      - NVIDIA-L4
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-RTX-A4000
                      - Tesla-V100-SXM2-16GB
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - NVIDIA-RTX-5000-Ada-Generation
                      - Tesla-V100-PCIE-16GB
                      - NVIDIA-TITAN-RTX
                      - NVIDIA-RTX-A5000
                      - Quadro-RTX-6000
                      - NVIDIA-RTX-4000-Ada-Generation
